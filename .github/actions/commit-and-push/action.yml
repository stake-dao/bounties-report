name: 'Commit and Push'
description: 'Rebase, stage the paths this job owns, commit, and push to main'
inputs:
  message:
    description: 'Commit message'
    required: true
  paths:
    description: |
      Newline-separated paths to stage, relative to the repository root.
      A pipeline must list every root it writes. Anything else left in the
      worktree stays uncommitted and is reported as a warning.
    required: true

runs:
  using: 'composite'
  steps:
    - name: Commit and push
      shell: bash
      env:
        STAGE_PATHS: ${{ inputs.paths }}
      run: |
        git pull --rebase --autostash origin main

        # Stage only what this job owns. This used to be `git add -A`, which
        # also picked up whatever else sat in the runner's worktree — a local
        # edit or a debug artifact — and pushed it to main with the pipeline's
        # commit.
        stage_paths=()
        while IFS= read -r entry; do
          [ -z "${entry// /}" ] && continue
          stage_paths+=("$entry")
        done <<< "$STAGE_PATHS"

        if [ "${#stage_paths[@]}" -eq 0 ]; then
          echo "::error::commit-and-push: the paths input is empty"
          exit 1
        fi

        git add -- "${stage_paths[@]}"

        # An output written outside the listed paths is a bug in the caller,
        # not something to push. Surface it here so the run log shows it
        # instead of the file silently disappearing with the runner.
        leftovers="$(
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u
        )"
        if [ -n "$leftovers" ]; then
          echo "::warning::Files outside the paths input were left uncommitted:"
          printf '%s\n' "$leftovers"
        fi

        if git diff --cached --quiet; then
          echo "No changes to commit, skipping"
          exit 0
        fi
        git commit -m "${{ inputs.message }}"

        # A rejected push throws away work the job already did (2026-08-13:
        # GitHub answered `remote: Internal Server Error` and the sdFXS merkle
        # commit died with the runner). Retry, rebasing in between so a
        # concurrent commit on main is absorbed rather than fought.
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::git push failed after $attempt attempts"
            exit 1
          fi
          echo "::warning::git push failed (attempt $attempt/3); rebasing before retry"
          sleep $((attempt * 10))
          # `|| true`: the step runs under `bash -e`, and an outage that breaks
          # push often breaks fetch too — a failed rebase must not abort the
          # remaining attempts.
          git pull --rebase --autostash origin main || true
        done
