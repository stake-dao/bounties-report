name: Verifier test-only checks

on:
  push:
    branches: [codex/require-all-verifiers]
    paths: [.github/workflows/verifier-test-only.yaml]

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Distrust compromised eMudhra chains
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check full-model verification
        run: pnpm exec vitest run script/test/integration/distributionVerify.test.ts script/test/unit/distributionVerify.test.ts
