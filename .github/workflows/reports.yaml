name: "Reports"

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: 'Protocol'
        required: true
        type: choice
        options:
          # sdTkns
          - curve
          - balancer
          - fxn
          - frax
          # vlCVX
          - vlcvx
      type:
        description: 'Report type'
        required: true
        type: choice
        options:
          - weekly
          - otc
      dispatch_id:
        description: 'Unique dispatch ID for tracking'
        required: false
        type: string
        default: ''
      check_run_id:
        description: 'Successful Guard completion run for a manual FXN weekly report'
        required: false
        type: string

jobs:
  run:
    if: inputs.protocol != 'fxn' || inputs.type != 'weekly'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: dispatch_id:${{ inputs.dispatch_id || 'manual' }}
        run: echo "dispatch tracking"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python: 'true'

      - name: Generate report
        run: make -f automation/reports.mk run-${{ inputs.type }}-${{ inputs.protocol }}
        env:
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Notify report verification (R1-R5)
        if: inputs.protocol == 'curve' || inputs.protocol == 'fxn'
        continue-on-error: true
        run: |
          WEEK=604800
          CURRENT_TIMESTAMP=$(date +%s)
          PERIOD=$(( CURRENT_TIMESTAMP / WEEK * WEEK ))
          pnpm tsx script/sdTkns/verify/reportGate.ts \
            --period "$PERIOD" \
            --protocol "${{ inputs.protocol }}" \
            --notify-only
        env:
          TELEGRAM_VERIF_API_KEY: ${{ secrets.TELEGRAM_VERIF_API_KEY }}
          TELEGRAM_VERIF_CHAT_ID: ${{ secrets.TELEGRAM_VERIF_CHAT_ID }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      # OTC is the final Monday-evening lane after the weekly report. It is
      # the last point at which both CSV lanes and attribution are complete.
      - name: Gate final report (R1-R5)
        if: (inputs.protocol == 'curve' || inputs.protocol == 'fxn') && inputs.type == 'otc'
        run: |
          WEEK=604800
          CURRENT_TIMESTAMP=$(date +%s)
          PERIOD=$(( CURRENT_TIMESTAMP / WEEK * WEEK ))
          pnpm tsx script/sdTkns/verify/reportGate.ts \
            --period "$PERIOD" \
            --protocol "${{ inputs.protocol }}"
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "chore: ${{ inputs.protocol }} ${{ inputs.type }} report [${{ inputs.dispatch_id }}]"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "Reports: ${{ inputs.protocol }} ${{ inputs.type }}"
          dispatch_id: ${{ inputs.dispatch_id }}
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}

  fxn:
    if: inputs.protocol == 'fxn' && inputs.type == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: fxn-weekly-report
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
      ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
      WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
      UPSTASH_REDIS_HOST: ${{ secrets.UPSTASH_REDIS_HOST }}
      UPSTASH_REDIS_PORT: ${{ secrets.UPSTASH_REDIS_PORT }}
      UPSTASH_REDIS_PASSWORD: ${{ secrets.UPSTASH_REDIS_PASSWORD }}
      UPSTASH_REDIS_USERNAME: ${{ secrets.UPSTASH_REDIS_USERNAME }}

    steps:
      - name: dispatch_id:${{ inputs.dispatch_id || 'manual' }}
        run: echo "dispatch tracking"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          frozen-lockfile: 'true'

      - name: Download matching completion proof
        id: proof
        run: pnpm tsx script/reports/fxnCompletion.ts fetch
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}

      - name: Checkout verified Guard checker
        uses: actions/checkout@v4
        with:
          repository: stake-dao/automation-guard
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          ref: ${{ steps.proof.outputs.guard_commit }}
          path: .fxn-guard
          persist-credentials: false

      - name: Move checker outside report checkout
        run: mv .fxn-guard "$RUNNER_TEMP/fxn-guard"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'

      - name: Revalidate completion without signing
        run: uv run --project "$RUNNER_TEMP/fxn-guard/jobs" --frozen fxn-swaps --check-only --completion /tmp/fxn-swaps-completion.input.json

      - name: Generate report from confirmed snapshot
        run: pnpm tsx script/reports/generateReport.ts fxn --completion /tmp/fxn-swaps-completion.input.json
        env:
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_TOKEN }}

      - name: Gate FXN report (R1-R5)
        run: pnpm tsx script/sdTkns/verify/reportGate.ts --period "$FXN_PERIOD" --protocol fxn --completion /tmp/fxn-swaps-completion.input.json
        env:
          FXN_PERIOD: ${{ steps.proof.outputs.period }}

      - name: Revalidate before publication
        run: uv run --project "$RUNNER_TEMP/fxn-guard/jobs" --frozen fxn-swaps --check-only --completion /tmp/fxn-swaps-completion.input.json

      - name: Publish verified FXN files
        run: pnpm tsx script/reports/fxnCompletion.ts publish

      - name: Record failure
        if: failure()
        run: echo '{"status":"error","reason":"FXN completion, report verification or publication failed"}' > /tmp/job_result.json

      - name: Upload job result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-result
          path: /tmp/job_result.json
          if-no-files-found: error

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: 'Reports: fxn weekly'
          dispatch_id: ${{ inputs.dispatch_id }}
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}
