name: "sdTokens: AI Verify"

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'sdToken to verify (e.g. sdfxs)'
        required: true
        type: string
      epoch:
        description: 'Epoch timestamp (default: current week)'
        required: false
        type: string
        default: ''
      dispatch_id:
        description: 'Unique dispatch ID for Temporal tracking (do not remove)'
        required: false
        type: string
        default: ''

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Distrust compromised eMudhra chains
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates

      - name: "dispatch_id:${{ inputs.dispatch_id || 'manual' }}"
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: echo "Dispatch ID - ${DISPATCH_ID:-manual}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: AI verify sdToken distribution
        run: |
          case "$TOKEN_INPUT" in
            sdfxs)   PROTOCOL=frax ;;
            spectra) PROTOCOL=spectra ;;
            *)
              echo "❌ Unsupported token '$TOKEN_INPUT': aiVerify.ts has no protocol mapping for it."
              echo "   Supported: sdfxs, spectra. Extend script/verify/aiVerify.ts to add more."
              exit 1
              ;;
          esac
          if [ -n "$EPOCH_INPUT" ]; then
            if ! [[ "$EPOCH_INPUT" =~ ^[0-9]+$ ]]; then
              echo "::error::epoch must be a unix timestamp: $EPOCH_INPUT"
              exit 1
            fi
            PERIOD="$EPOCH_INPUT"
          else
            WEEK=604800
            PERIOD=$(( $(date +%s) / WEEK * WEEK ))
          fi
          echo "Token=$TOKEN_INPUT Protocol=$PROTOCOL Period=$PERIOD"
          pnpm tsx script/verify/aiVerify.ts --timestamp "$PERIOD" --protocol "$PROTOCOL"
        env:
          TOKEN_INPUT: ${{ inputs.token }}
          EPOCH_INPUT: ${{ inputs.epoch }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          TEST_TELEGRAM_API_KEY: ${{ secrets.TEST_TELEGRAM_API_KEY }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "sdTokens: AI Verify"
          dispatch_id: ${{ inputs.dispatch_id }}
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}
