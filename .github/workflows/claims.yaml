name: "Claims"

on:
  # Fired by stake-dao/workflows bribes-vlcvx-votium-claim.yaml right after
  # the biweekly (even-week) Wednesday on-chain Votium claim. Runs the
  # convex-votium generation so the claim data exists before Thursday's
  # voters merkle (createCombinedMerkle refuses to build a claim-week merkle
  # without it).
  repository_dispatch:
    types: [update-votium-claims]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to claim from'
        required: true
        type: choice
        options:
          # sdTkns
          - votemarket
          - votemarket-v2
          - spectra
          # vlCVX
          - convex-votemarket-v2
          - convex-votium
      dispatch_id:
        description: 'Unique dispatch ID for tracking'
        required: false
        type: string
        default: ''
      past_week:
        description: 'Number of weeks in the past (0 for current)'
        required: false
        type: string
        default: '0'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # repository_dispatch carries no inputs: the platform is hardcoded (the
      # client payload is deliberately ignored) and past_week stays 0 — fired
      # on Wednesday, generateConvexVotium targets the upcoming Thursday
      # period (floor(now / WEEK) * WEEK + WEEK).
      PLATFORM: ${{ github.event_name == 'repository_dispatch' && 'convex-votium' || inputs.platform }}
      PAST_WEEK: ${{ github.event_name == 'repository_dispatch' && '0' || inputs.past_week }}
      DISPATCH_ID: ${{ github.event_name == 'repository_dispatch' && 'update-votium-claims' || inputs.dispatch_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: "dispatch_id:${{ github.event_name == 'repository_dispatch' && 'update-votium-claims' || inputs.dispatch_id || 'manual' }}"
        run: echo "Tracked"

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python: 'true'

      # Must run BEFORE claims generation: generateConvexVotium discovers
      # non-voting forwarders from this index.
      - name: Refresh Votium forwarders index (convex-votium only)
        if: env.PLATFORM == 'convex-votium'
        run: make -f automation/indexer.mk get-forwarders
        env:
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}

      - name: Generate claims
        run: |
          case "$PLATFORM" in
            # sdTkns
            votemarket)            make -f automation/weekly-bounties.mk run-votemarket PAST_WEEK=$PAST_WEEK ;;
            votemarket-v2)         make -f automation/weekly-bounties.mk run-votemarket-v2 PAST_WEEK=$PAST_WEEK ;;
            spectra)               make -f automation/weekly-bounties.mk run-spectra PAST_WEEK=$PAST_WEEK ;;
            # vlCVX
            convex-votemarket-v2)  make -f automation/weekly-bounties.mk run-convex-votemarket-v2 PAST_WEEK=$PAST_WEEK ;;
            convex-votium)         make -f automation/weekly-bounties.mk run-convex-votium PAST_WEEK=$PAST_WEEK ;;
          esac
        env:
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          TELEGRAM_VERIF_API_KEY: ${{ secrets.TELEGRAM_VERIF_API_KEY }}
          TELEGRAM_VERIF_CHAT_ID: ${{ secrets.TELEGRAM_VERIF_CHAT_ID }}

      - name: Run delegators indexer (convex-votium only)
        if: env.PLATFORM == 'convex-votium'
        run: make -f automation/indexer.mk get-delegators
        env:
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "chore: ${{ env.PLATFORM }} claims [${{ env.DISPATCH_ID }}]"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "Claims: ${{ env.PLATFORM }}"
          dispatch_id: ${{ env.DISPATCH_ID }}
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}
