name: "Rewards: Adopt confirmed Safe recovery"
run-name: ${{ inputs.dispatch_id || 'Manual recovery adoption' }}

on:
  workflow_dispatch:
    inputs:
      pool:
        type: choice
        options: [voters-1, voters-8453, voters-42161, extra-1]
        required: true
      preparation_run:
        type: string
        required: true
        description: Successful rewards-recovery.yaml run ID
      preparation_attempt:
        type: string
        required: true
        description: Exact preparation attempt used for the signed proposal
      archive_commit:
        type: string
        required: true
        description: Immutable preparation archive commit used for the signed proposal
      archive_sha256:
        type: string
        required: true
        description: SHA256 of the preparation ZIP used for the signed proposal
      transaction:
        type: string
        required: true
        description: Finalized on-chain owner Safe execution hash (not Safe proposal hash)
      publish:
        type: boolean
        default: false
        description: Commit verified baseline data to main while publishers are held
      check_access_only:
        type: boolean
        default: false
        description: Check Git push access without replaying or publishing a recovery
      dispatch_id:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: rewards-recovery-adoption
  cancel-in-progress: false

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check recovery publication access
        env:
          GH_TOKEN: ${{ secrets.RECOVERY_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "RECOVERY_GITHUB_TOKEN is missing"; exit 1; }
          gh auth setup-git
          for repository in bounties-report merkl-toolkit; do
            git clone --bare --depth 1 --filter=blob:none --single-branch --branch main \
              "https://github.com/stake-dao/$repository.git" "$RUNNER_TEMP/$repository"
            git -C "$RUNNER_TEMP/$repository" push --dry-run origin HEAD:refs/heads/main
            echo "Git push authentication passed: stake-dao/$repository (dry run; no changes)"
          done

  adopt:
    needs: access
    if: '!inputs.check_access_only'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "dispatch_id:${{ inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.pool == 'extra-1'
        with:
          repository: stake-dao/merkl-toolkit
          ref: main
          path: merkl-toolkit
          token: ${{ secrets.RECOVERY_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - run: pnpm install --frozen-lockfile

      - name: Download the durable signed preparation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.preparation_run }}
          ATTEMPT: ${{ inputs.preparation_attempt }}
          ARCHIVE_COMMIT: ${{ inputs.archive_commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ && "$ARCHIVE_COMMIT" =~ ^[a-f0-9]{40}$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rewards-recovery.yaml" --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT")
          echo "$run" | jq -e --argjson workflow "$workflow_id" --arg repo "$GITHUB_REPOSITORY" '.workflow_id == $workflow and .conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo'
          head=$(echo "$run" | jq -r .head_sha)
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$ARCHIVE_COMMIT" | jq -e --arg head "$head" '.parents | length == 1 and .[0].sha == $head'
          blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/recovery-preparations/$RUN_ID-$ATTEMPT.zip?ref=$ARCHIVE_COMMIT" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode > "$RUNNER_TEMP/recovery-input.zip"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/recovery-input.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/recovery-input.zip" -d "$RUNNER_TEMP/recovery-input"

      - name: Verify receipt, replay preparation and build canonical baseline changes
        env:
          POOL: ${{ inputs.pool }}
          TRANSACTION: ${{ inputs.transaction }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
        run: pnpm tsx script/recovery/adopt.ts "$POOL" "$RUNNER_TEMP/recovery-input/$POOL" "$TRANSACTION" --write

      - name: Propose the extra-rewards baseline
        id: extra
        if: inputs.pool == 'extra-1' && !inputs.publish
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RECOVERY_GITHUB_TOKEN }}
          path: merkl-toolkit
          branch: recovery/adopt-${{ inputs.pool }}-${{ inputs.preparation_run }}
          title: "Adopt confirmed recovery: ${{ inputs.pool }}"
          commit-message: "Adopt confirmed Safe recovery baseline"
          add-paths: |
            data/last_merkle.json
            data/recoveries/
          body: |
            Confirmed transaction: `${{ inputs.transaction }}`.
            Preparation: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.preparation_run }}
            Claims, amounts and finalized publication were independently verified. Historical distributions are unchanged.
            Keep competing root publishers paused and drained until this PR AND the bounties-report audit PR are reviewed and merged. Recheck the live root before merge.

      - name: Propose the canonical voter baseline or extra audit record
        id: audit
        if: '!inputs.publish'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RECOVERY_GITHUB_TOKEN }}
          branch: recovery/adopt-${{ inputs.pool }}-${{ inputs.preparation_run }}
          title: "Adopt confirmed recovery: ${{ inputs.pool }}"
          commit-message: "Record confirmed Safe recovery and canonical proofs"
          add-paths: bounties-reports/
          body: |
            Confirmed transaction: `${{ inputs.transaction }}`.
            Preparation: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.preparation_run }}
            Extra baseline PR (when applicable): ${{ steps.extra.outputs.pull-request-url }}
            The adoption replay validates claims, deficits, root history and finality. The archive preserves original and reduced trees, the approved review, gross/offset/net amounts and receipt.
            Keep root publishers paused and drained until all adoption PRs are reviewed and merged. Recheck the live root before merge. No execution, merge, timelock change or signing is performed by this workflow.

      - name: Publish verified baseline data
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RECOVERY_GITHUB_TOKEN }}
          POOL: ${{ inputs.pool }}
        run: |
          set -euo pipefail
          gh auth setup-git
          publish() {
            local directory="$1"
            shift
            git -C "$directory" config user.name 'github-actions[bot]'
            git -C "$directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$directory" add -- "$@"
            if git -C "$directory" diff --cached --quiet; then return; fi
            git -C "$directory" commit -m "Adopt confirmed monthly Safe recovery: $POOL"
            # No rebase/force push: a concurrent baseline update requires replay.
            git -C "$directory" push origin HEAD:main
          }
          if [ "$POOL" = extra-1 ]; then
            publish merkl-toolkit data/last_merkle.json data/recoveries/
          fi
          publish . bounties-reports/

      - name: Report adoption outcome to Telegram
        if: always()
        env:
          TELEGRAM_VERIF_API_KEY: ${{ secrets.TELEGRAM_VERIF_API_KEY }}
          TELEGRAM_VERIF_CHAT_ID: ${{ secrets.TELEGRAM_VERIF_CHAT_ID }}
          OUTCOME: ${{ job.status }}
          POOL: ${{ inputs.pool }}
          TRANSACTION: ${{ inputs.transaction }}
          AUDIT_PR: ${{ steps.audit.outputs.pull-request-url }}
          EXTRA_PR: ${{ steps.extra.outputs.pull-request-url }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          pnpm tsx -e 'import {sendTelegramMessage} from "./script/utils/telegramUtils"; const text = ["Recovery adoption: " + process.env.OUTCOME, process.env.POOL, process.env.TRANSACTION, process.env.AUDIT_PR, process.env.EXTRA_PR, process.env.PUBLISH === "true" && process.env.OUTCOME === "success" ? "Verified proofs and reduced baseline published. Coordinator can reconcile completion." : "Keep publishers paused until baseline publication is verified.", process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID].filter(Boolean).join("\n").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); sendTelegramMessage(text, "HTML", true).catch(() => { console.error("Telegram delivery failed"); process.exitCode = 1; });'
