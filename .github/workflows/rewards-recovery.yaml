name: "Rewards: Recovery preparation retired"
run-name: ${{ inputs.dispatch_id || 'Manual recovery preparation' }}

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, voters, extra]
        default: all
        required: true
        description: Reviewed pools to refresh after root acceptance
      notify:
        type: boolean
        default: true
        description: Send the detailed Telegram report
      monthly:
        type: boolean
        default: true
        description: Reconcile fresh six-month eligibility for the monthly period
      period:
        type: string
        default: ''
        description: Optional YYYY-MM period to finish after a delayed Safe approval
      dispatch_id:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rewards-recovery-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "dispatch_id:${{ inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Reject new recovery preparation
        run: |
          printf '%s\n' '{"status":"error","reason":"Module recovery retired; new recoveries disabled. Archived Safe adoption remains available."}' > "$RUNNER_TEMP/job_result.json"
          echo '::error::New recoveries are disabled; do not retry preparation or enable the retired module.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-result
          path: ${{ runner.temp }}/job_result.json
