name: "sdTokens: Post-freeze"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Prepare the freeze token set, or verify the frozen distribution"
        required: true
        type: choice
        default: post-freeze
        options:
          - check
          - post-freeze
      mode:
        description: "Test or execute directly"
        required: true
        type: choice
        default: test
        options:
          - test
          - execute
      dispatch_id:
        description: "Unique dispatch ID for tracking"
        required: false
        type: string
        default: ""

jobs:
  post-freeze:
    runs-on: ubuntu-latest
    env:
      EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
    permissions:
      contents: write

    steps:
      - name: "dispatch_id:${{ inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          frozen-lockfile: 'true'

      - name: Calculate current period
        id: period
        run: |
          WEEK=604800
          CURRENT_TIMESTAMP=$(date +%s)
          PERIOD=$(( CURRENT_TIMESTAMP / WEEK * WEEK ))
          echo "current=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Verify report leg (R1-R5)
        run: pnpm tsx script/sdTkns/verify/reportGate.ts --period "${{ steps.period.outputs.current }}"
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Preserve an already verified distribution
        id: existing
        env:
          PERIOD: ${{ steps.period.outputs.current }}
        run: |
          FILE="bounties-reports/${PERIOD}/sdtokens-distribution.json"
          if [ -f "$FILE" ] && jq -e --argjson period "$PERIOD" '.period == $period and .verified == true and .postFreeze == true' "$FILE" >/dev/null; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate pre-freeze merkle
        if: inputs.stage == 'check' && steps.existing.outputs.reuse != 'true'
        run: pnpm tsx script/sdTkns/generateMerkle.ts --log
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          BOTS_ENVIO_GRAPHQL_URL_WORKER: ${{ secrets.BOTS_ENVIO_GRAPHQL_URL_WORKER }}

      - name: Generate post-freeze merkle
        if: inputs.stage == 'post-freeze' && steps.existing.outputs.reuse != 'true'
        run: pnpm tsx script/sdTkns/generateMerkle.ts --log --post-freeze
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          BOTS_ENVIO_GRAPHQL_URL_WORKER: ${{ secrets.BOTS_ENVIO_GRAPHQL_URL_WORKER }}

      - name: Reconstruct sdMerkle
        if: inputs.stage == 'post-freeze'
        run: pnpm tsx script/sdTkns/verify/reconstructSdMerkle.ts --period "${{ steps.period.outputs.current }}"
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Verify before submission
        if: inputs.stage == 'post-freeze'
        run: pnpm tsx script/sdTkns/verify/checkBeforeSetRoots.ts --period "${{ steps.period.outputs.current }}"
        env:
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Export checked guard distribution
        if: steps.existing.outputs.reuse != 'true'
        env:
          STAGE: ${{ inputs.stage }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
        run: |
          args=()
          if [ "$STAGE" = post-freeze ]; then args+=(--verified); fi
          pnpm tsx script/sdTkns/prepareDistribution.ts "${args[@]}"

      - name: Commit verified post-freeze artifacts
        if: inputs.mode == 'execute'
        env:
          PERIOD: ${{ steps.period.outputs.current }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Stake DAO Automation"
          git add "bounties-reports/${PERIOD}/" log.json data/merkle_updates/
          if git diff --cached --quiet; then
            echo "No post-freeze changes to commit"
            exit 0
          fi
          git commit -m "[sdTkns] post-freeze generation + reconstruction"

          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Unable to push verified post-freeze artifacts after 3 attempts"
            exit 1
          fi
