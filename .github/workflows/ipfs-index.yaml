name: "IPFS: evidence index"

# Single writer of data/ipfs-index.json: whenever a pipeline commits its pin
# map or rewrites a pinned file, checks every map against the committed tree
# and re-pins what drifted (pinToIpfs --heal), rebuilds and pins the evidence
# index, serialized so concurrent merkle runs never race on the shared
# pointer. The contenthash of rewards.stakedao.eth follows it through the
# Maestro ens-publish-guard sweep (automation-guard ens-publish, every 2h).
# Invariant on main: map entry == committed bytes.

on:
  push:
    branches: [main]
    paths:
      - "bounties-reports/*/ipfs/*.json"
      - "bounties-reports/*/merkle.json"
      - "bounties-reports/*/sdtokens-distribution.json"
      - "bounties-reports/*/*.csv"
      - "bounties-reports/*/*-attribution.json"
      - "bounties-reports/*/vlCVX/vlcvx_merkle*.json"
      - "bounties-reports/*/vlCVX/merkle_data_delegators.json"
      - "log.json"
      - "data/merkle_updates/**"
  workflow_dispatch:

concurrency:
  group: ipfs-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          frozen-lockfile: 'true'

      - name: Re-pin map entries that no longer match the committed tree
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
          PINNING_SERVICE_URL: ${{ vars.PINNING_SERVICE_URL }}
          PINNING_SERVICE_TOKEN: ${{ secrets.PINNING_SERVICE_TOKEN }}
        run: pnpm tsx script/helpers/pinToIpfs.ts --heal

      - name: Pin evidence index
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
          PINNING_SERVICE_URL: ${{ vars.PINNING_SERVICE_URL }}
          PINNING_SERVICE_TOKEN: ${{ secrets.PINNING_SERVICE_TOKEN }}
        run: pnpm tsx script/helpers/pinToIpfs.ts --index

      - name: Every map now matches the tree
        run: pnpm tsx script/helpers/pinToIpfs.ts --check

      - name: Commit maps and pointer
        uses: ./.github/actions/commit-and-push
        with:
          message: "chore: ipfs evidence index"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "IPFS: evidence index"
          dispatch_id: manual
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}
