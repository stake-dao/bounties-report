name: "vlCVX: AI Verify"

# Gate workflow used by the orchestrator vlcvx-delegators pipeline.
# Wraps aiVerify.ts (`--protocol vlCVX --deep`) so verification verdict
# determines pipeline progression: exit 0 = pass → set-root proceeds,
# exit 1 = fail → pipeline halts before any on-chain action.

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Distribution type — voters scopes deterministic invariants to voters; supplies authoritative run context (--run-type)'
        required: true
        type: choice
        options:
          - delegators
          - voters
      epoch:
        description: 'Epoch timestamp (default: current week)'
        required: false
        type: string
        default: ''
      identity:
        description: 'Immutable delegator identity from the producer (required for delegators)'
        required: false
        type: string
      dispatch_id:
        description: 'Unique dispatch ID for Temporal tracking (do not remove)'
        required: false
        type: string
        default: ''

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Distrust compromised eMudhra chains
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates

      - name: "dispatch_id:${{ inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Checkout exact delegator evidence
        if: inputs.type == 'delegators'
        env:
          DISTRIBUTION_IDENTITY: ${{ inputs.identity }}
        run: |
          revision=$(jq -er '.revision' <<< "$DISTRIBUTION_IDENTITY")
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          git checkout --detach "$revision"

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Bind verification to producer bytes
        if: inputs.type == 'delegators'
        env:
          DISTRIBUTION_IDENTITY: ${{ inputs.identity }}
          EPOCH: ${{ inputs.epoch }}
        run: pnpm tsx script/helpers/distributionIdentity.ts verify "$RUNNER_TEMP/distribution-snapshot.json"

      - name: AI verify vlCVX distribution
        run: |
          if [ -n "$EPOCH_INPUT" ]; then
            if ! [[ "$EPOCH_INPUT" =~ ^[0-9]+$ ]]; then
              echo "::error::epoch must be a unix timestamp: $EPOCH_INPUT"
              exit 1
            fi
            PERIOD="$EPOCH_INPUT"
          else
            WEEK=604800
            PERIOD=$(( $(date +%s) / WEEK * WEEK ))
          fi
          TARGET=both
          if [ "$RUN_TYPE" = "voters" ]; then
            TARGET=voters
          fi
          echo "Type=$RUN_TYPE Period=$PERIOD"
          pnpm tsx script/verify/aiVerify.ts --timestamp "$PERIOD" --protocol vlCVX --target "$TARGET" --deep --run-type "$RUN_TYPE"
        env:
          EPOCH_INPUT: ${{ inputs.epoch }}
          RUN_TYPE: ${{ inputs.type }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          EXPLORER_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
          TEST_TELEGRAM_API_KEY: ${{ secrets.TEST_TELEGRAM_API_KEY }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}

      - name: Export identity only after verification passes
        if: inputs.type == 'delegators'
        run: pnpm tsx script/helpers/distributionIdentity.ts export "$RUNNER_TEMP/distribution-snapshot.json"

      - uses: actions/upload-artifact@v4
        if: inputs.type == 'delegators'
        with:
          name: job-result
          path: /tmp/job_result.json
          if-no-files-found: error

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "vlCVX: AI Verify (${{ inputs.type }})"
          dispatch_id: ${{ inputs.dispatch_id }}
          telegram_token: ${{ secrets.TG_API_KEY_BOT_ERROR }}
